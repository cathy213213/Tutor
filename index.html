<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學家教紀錄📝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F4;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#D8DEE6;
    --red:#C1443C;
    --red-soft:#F3DAD8;
    --teal:#2F6F62;
    --teal-soft:#DCEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;}

  header{margin-bottom:16px;}
  .eyebrow-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  h1{font-family:'Noto Serif TC', serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:.02em;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}
  .encourage{color:var(--teal);font-size:13px;margin:12px 0 0;line-height:1.6;}

  .toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0;}
  .toggle button{border:none;background:transparent;padding:7px 12px;border-radius:999px;font-family:'Noto Sans TC',sans-serif;font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .toggle button.active{background:var(--ink);color:#fff;}

  /* student tabs */
  .student-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;-webkit-overflow-scrolling:touch;}
  .student-tab{
    flex-shrink:0;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  .student-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .student-tab.add{color:var(--teal);border-style:dashed;border-color:var(--teal);background:transparent;}
  .no-student{color:var(--ink-soft);font-size:14px;padding:6px 0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}

  /* student header / fee summary */
  .student-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:2px;}
  .student-name-row{display:flex;align-items:baseline;gap:10px;}
  .student-name{font-family:'Noto Serif TC',serif;font-weight:700;font-size:19px;}
  .student-rate{font-size:12px;color:var(--ink-soft);}
  .student-actions{display:flex;gap:10px 12px;flex-wrap:wrap;}
  .student-actions button{border:none;background:none;font-size:12px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:0;}
  .student-actions button.danger{color:var(--red);}

  .fee-summary{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap;}
  .fee-item .num{font-family:'Noto Serif TC',serif;font-weight:700;font-size:22px;}
  .fee-item .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .fee-item.total .num{color:var(--red);}

  .pay-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;margin-top:14px;border:none;font-family:'Noto Sans TC',sans-serif;}
  .pay-badge.paid{background:var(--teal-soft);color:var(--teal);}
  .pay-badge.unpaid{background:var(--red-soft);color:var(--red);}
  .pay-badge.clickable{cursor:pointer;}
  .pay-dot{font-size:12px;margin-left:6px;}
  .no-save{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  .lightbox-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lightbox-backdrop img{max-width:100%;max-height:100%;border-radius:8px;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head h2{font-family:'Noto Serif TC',serif;font-size:18px;margin:0;font-weight:700;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink-soft);}
  .cal-nav button:hover{background:var(--paper);}

  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .dow{text-align:center;font-size:12px;color:var(--ink-soft);padding-bottom:6px;}
  .day{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink);}
  .day.pad{visibility:hidden;}
  .day.today{border-color:var(--red);}
  .day.has-schedule{background:var(--teal-soft);}
  .day.has-lesson{cursor:pointer;background:var(--red-soft);}
  .day.has-lesson:hover{filter:brightness(0.97);}
  .day.selected{outline:2px solid var(--ink);outline-offset:1px;}
  .day .dot{width:5px;height:5px;border-radius:50%;background:var(--red);margin-top:2px;}
  .day .dot.dot-schedule{background:var(--teal);}

  /* overview calendar: bigger cells showing time+name inline */
  .ov-grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .ov-day{border-radius:8px;border:1px solid transparent;padding:4px 3px;min-height:60px;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;}
  .ov-day.pad{visibility:hidden;}
  .ov-day.today{border-color:var(--red);}
  .ov-day .ov-num{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .ov-day .ov-entry{font-size:9.5px;line-height:1.35;color:var(--teal);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
  .day.clickable{cursor:pointer;}
  .day.clickable:hover{background:var(--paper);}

  .legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* schedule list */
  .sched-group{margin-bottom:14px;}
  .sched-group:last-child{margin-bottom:0;}
  .sched-group-title{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .sched-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;}
  .sched-item:first-of-type{border-top:none;}
  .sched-item .sched-when{font-weight:500;}
  .sched-item button{border:none;background:none;font-size:12px;color:var(--red);cursor:pointer;text-decoration:underline;padding:0;}
  .sched-empty{font-size:13px;color:var(--ink-soft);padding:6px 0;}
  .sched-add-row{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}
  .sched-add-row button{border:none;background:none;font-size:13px;color:var(--teal);cursor:pointer;font-weight:500;padding:0;}

  .section-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:18px;margin:0 0 14px;}

  .entry{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);}
  .entry:first-of-type{border-top:none;}
  .badge{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:700;font-size:13px;}
  .entry-body{flex:1;min-width:0;}
  .entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .entry-date{font-weight:700;font-size:14px;}
  .entry-dur{font-size:12px;color:var(--ink-soft);}
  .entry-field{margin-top:8px;font-size:13px;line-height:1.6;}
  .entry-field .label{color:var(--red);font-weight:500;margin-right:4px;}
  .entry-field .empty{color:var(--ink-soft);font-style:normal;}
  .entry-actions{margin-top:10px;display:flex;gap:10px;}
  .entry-actions button{border:none;background:none;font-size:12px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:0;}
  .entry-actions button.danger{color:var(--red);}

  .empty-state{text-align:center;color:var(--ink-soft);font-size:14px;padding:24px 0;}

  .form-wrap{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field textarea{width:100%;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;resize:vertical;}
  .field textarea{min-height:64px;}
  .form-row{display:flex;gap:10px;}
  .form-row .field{flex:1;}
  .form-actions{display:flex;gap:10px;margin-top:4px;}
  .btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .add-trigger{margin-top:14px;font-size:13px;color:var(--teal);background:none;border:none;cursor:pointer;font-weight:500;padding:0;}

  .parent-note{background:var(--teal-soft);color:var(--teal);font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:16px;}
  .storage-warning{background:#FBEAE9;border:1px solid var(--red);color:var(--red);font-size:12px;line-height:1.6;padding:10px 14px;border-radius:8px;margin-bottom:16px;}

  footer{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:24px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(27,36,48,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-box{background:#fff;border-radius:14px;padding:22px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2);}
  .modal-box h3{font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 16px;}
  .modal-box p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;justify-content:flex-end;}
  .link-box{display:flex;gap:8px;margin-bottom:6px;}
  .link-box input{flex:1;font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:60;white-space:nowrap;}

  @media (max-width:420px){
    h1{font-size:23px;}
    .day{font-size:11px;}
    .badge{width:38px;height:38px;font-size:11px;}
    .fee-summary{gap:14px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-row">
      <div>
        <h1 id="mainTitle">數學家教紀錄📝</h1>
        <p class="sub" id="subline">載入中…</p>
      </div>
      <div class="toggle" id="modeToggle">
        <button id="btnTeacher" class="active">老師模式</button>
        <button id="btnParent">家長檢視</button>
        <button id="btnStudent">學生檢視</button>
      </div>
    </div>
    <p class="encourage" id="encourageText">希望孩子的數學能夠越來越穩定進步💪🏻讓我們一起努力吧🌷</p>
  </header>

  <div id="overviewRow" style="display:none;margin-bottom:16px;gap:18px;">
    <button class="add-trigger" id="overviewBtn">📊 全部學生總覽</button>
    <button class="add-trigger" id="profileEditBtn">👩‍🏫 編輯老師介紹頁</button>
  </div>

  <div class="student-tabs" id="studentTabs"></div>

  <div id="storageWarning" style="display:none" class="storage-warning"></div>

  <div id="backupRow" style="display:none;gap:18px;margin-bottom:16px;">
    <button class="add-trigger" id="exportBtn">↓ 匯出備份</button>
    <button class="add-trigger" id="importBtn">↑ 匯入備份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div id="mainArea"></div>

  <footer>老師請用主連結管理所有學生；每位學生的「家長專屬連結」點開後只會看到該生的紀錄。</footer>
</div>
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLVdExuFVD09S6oczF7ueFMx1JJDrCXaw",
  authDomain: "tutor-bac57.firebaseapp.com",
  projectId: "tutor-bac57",
  storageBucket: "tutor-bac57.firebasestorage.app",
  messagingSenderId: "74721224494",
  appId: "1:74721224494:web:b9ef50acba4b65c0be3cbf"
};

let db = null;
let storage = null;
try{
  const fbApp = initializeApp(firebaseConfig);
  db = getFirestore(fbApp);
  storage = getStorage(fbApp);
}catch(e){
  console.error('Firebase init failed', e);
}

const $ = (sel, root=document) => root.querySelector(sel);
const dowNames = ['日','一','二','三','四','五','六'];

let state = {
  students: [],       // {id, name, rate}
  lessons: [],         // {id, studentId, date, hours, topics, homework}
  schedules: [],        // {id, studentId, mode:'weekly'|'once', dayOfWeek, date, hour, minute}
  payments: [],         // {id, studentId, month:'YYYY-MM', paid:true}
  summaries: [],        // {id, studentId, month:'YYYY-MM', text}
  currentStudentId: null,
  viewMode: 'teacher',
  lockedParent: false,   // true when opened via a student's parent link
  lockedStudent: false,  // true when opened via a student's own link
  cursor: new Date(),
  selectedDate: null,
  formOpen: false,
  editingLessonId: null,
  editingStudent: false,
  loaded: false,
  showOverview: false,
  showProfileEdit: false,
  lockedProfile: false,
  profile: null,
  viewCounts: {},
  viewTracked: false
};

const dayNames = ['週日','週一','週二','週三','週四','週五','週六'];

function applyRouteFromHash(){
  const parentMatch = window.location.hash.match(/^#\/parent\/(.+)$/);
  const studentMatch = window.location.hash.match(/^#\/student\/(.+)$/);
  if(parentMatch){
    state.lockedParent = true;
    state.viewMode = 'parent';
    state.currentStudentId = decodeURIComponent(parentMatch[1]);
  } else if(studentMatch){
    state.lockedStudent = true;
    state.currentStudentId = decodeURIComponent(studentMatch[1]);
  } else if(window.location.hash === '#/about'){
    state.lockedProfile = true;
  }
}

function pad(n){ return String(n).padStart(2,'0'); }
function toKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return toKey(new Date()); }
function escapeHtml(str){ const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }
function formatTime(h,m){ return `${pad(h)}:${pad(m)}`; }
function hourOptions(selected){
  let html='';
  for(let h=0; h<24; h++){ html += `<option value="${h}" ${h===selected?'selected':''}>${pad(h)}</option>`; }
  return html;
}
function minuteOptions(selected){
  return [0,15,30,45].map(m=>`<option value="${m}" ${m===selected?'selected':''}>${pad(m)}</option>`).join('');
}
function uid(){ return String(Date.now())+Math.floor(Math.random()*1000); }
function defaultProfile(){
  return { name:'', photoUrl:'', education:'', experience:'', experiencePhotoUrl:'', educationList:[], teachingHistory:[], testimonials:[], classPhotos:[] };
}
function formatMonthRange(startMonth, endMonth, ongoing){
  const fmt = (m)=> m ? m.replace('-','/') : '';
  if(ongoing) return `${fmt(startMonth)} - 至今`;
  if(startMonth && endMonth) return `${fmt(startMonth)} - ${fmt(endMonth)}`;
  if(startMonth) return fmt(startMonth);
  return '';
}
function eduLine(e){
  const range = formatMonthRange(e.startMonth, e.endMonth, e.ongoing);
  const main = `${e.degree ? escapeHtml(e.degree)+'．' : ''}${escapeHtml(e.school)}`;
  return range ? `${main}<br><span style="color:var(--ink-soft);font-size:12px;">${range}</span>` : main;
}
function teachLine(t){
  if(t.school !== undefined){
    const range = formatMonthRange(t.startMonth, t.endMonth, t.ongoing);
    const main = `${escapeHtml(t.school)}${t.title ? '．'+escapeHtml(t.title) : ''}`;
    return range ? `${main}<br><span style="color:var(--ink-soft);font-size:12px;">${range}</span>` : main;
  }
  return escapeHtml(t.text || '');
}

/* ---------- modal / toast (replaces blocked browser prompt/confirm/alert) ---------- */
function showModal(html){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-box">${html}</div></div>`;
  $('#modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
}
function closeModal(){ const root = $('#modalRoot'); if(root) root.innerHTML=''; }
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.maxWidth = '85vw';
  t.style.whiteSpace = 'normal';
  t.style.textAlign = 'center';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 7000);
}
function showPersistentError(msg){
  const box = $('#storageWarning');
  if(!box) return;
  box.textContent = '⚠️ ' + msg;
  box.style.display = 'block';
}

async function loadData(){
  if(!db){
    showPersistentError('無法連線到資料庫（Firebase 初始化失敗），請確認設定是否正確。');
    state.loaded = true;
    render();
    return;
  }
  try{
    const [sSnap, lSnap, schSnap, paySnap, sumSnap, profSnap, viewSnap] = await Promise.all([
      getDoc(doc(db,'tutorlog','students')),
      getDoc(doc(db,'tutorlog','lessons')),
      getDoc(doc(db,'tutorlog','schedules')),
      getDoc(doc(db,'tutorlog','payments')),
      getDoc(doc(db,'tutorlog','summaries')),
      getDoc(doc(db,'tutorlog','profile')),
      getDoc(doc(db,'tutorlog','viewCounts'))
    ]);
    state.students = sSnap.exists() ? (sSnap.data().list || []) : [];
    state.lessons = lSnap.exists() ? (lSnap.data().list || []) : [];
    state.schedules = schSnap.exists() ? (schSnap.data().list || []) : [];
    state.payments = paySnap.exists() ? (paySnap.data().list || []) : [];
    state.summaries = sumSnap.exists() ? (sumSnap.data().list || []) : [];
    state.profile = profSnap.exists() ? profSnap.data() : defaultProfile();
    state.viewCounts = viewSnap.exists() ? (viewSnap.data() || {}) : {};
  }catch(e){
    showPersistentError('讀取資料時發生問題：'+(e?.message||e));
    state.students = [];
    state.lessons = [];
    state.schedules = [];
    state.payments = [];
    state.summaries = [];
    state.profile = defaultProfile();
    state.viewCounts = {};
  }
  // fill in any missing profile fields / migrate old plain-text education
  {
    const p = state.profile;
    let profileChanged = false;
    if(p.teachingHistory===undefined){ p.teachingHistory = []; profileChanged = true; }
    if(p.testimonials===undefined){ p.testimonials = []; profileChanged = true; }
    if(p.classPhotos===undefined){ p.classPhotos = []; profileChanged = true; }
    if(p.educationList===undefined){
      profileChanged = true;
      if(typeof p.education === 'string' && p.education.trim()){
        p.educationList = [{ id: uid(), degree:'', school: p.education.trim(), startMonth:'', endMonth:'', ongoing:false }];
      } else {
        p.educationList = [];
      }
    }
    if(profileChanged) saveProfile();
  }
  // migrate single flat rate into rateHistory
  let studentsChanged = false;
  state.students = state.students.map(s=>{
    if(s.rateHistory === undefined){
      studentsChanged = true;
      const hist = (s.rate!==undefined && s.rate!==null) ? [{ id: uid(), month: '2000-01', rate: s.rate }] : [];
      const { rate, ...rest } = s;
      return { ...rest, rateHistory: hist };
    }
    return s;
  });
  if(studentsChanged) saveStudents();

  // migrate legacy records that stored duration in minutes to hours
  let migrated = false;
  state.lessons = state.lessons.map(l=>{
    if(l.hours===undefined){
      migrated = true;
      const hours = l.duration ? Math.round((l.duration/60)*10)/10 : null;
      const { duration, ...rest } = l;
      return { ...rest, hours };
    }
    return l;
  });
  if(migrated) saveLessons();

  // migrate old weekly-rule / once-mode schedules into concrete dated entries, and backfill hours
  let schedChanged = false;
  const expanded = [];
  state.schedules.forEach(s=>{
    if(s.mode === 'weekly'){
      schedChanged = true;
      let d = new Date();
      d.setHours(0,0,0,0);
      while(d.getDay() !== s.dayOfWeek) d.setDate(d.getDate()+1);
      for(let i=0;i<8;i++){
        expanded.push({ id: uid(), studentId: s.studentId, date: toKey(d), hour: s.hour, minute: s.minute, hours: 1.5 });
        d.setDate(d.getDate()+7);
      }
    } else if(s.mode === 'once'){
      schedChanged = true;
      expanded.push({ id: s.id, studentId: s.studentId, date: s.date, hour: s.hour, minute: s.minute, hours: 1.5 });
    } else if(s.hours === undefined){
      schedChanged = true;
      expanded.push({ ...s, hours: 1.5 });
    } else {
      expanded.push(s);
    }
  });
  state.schedules = expanded;
  if(schedChanged) saveSchedules();

  applyRouteFromHash();
  if(state.students.length && !state.currentStudentId && !state.lockedParent && !state.lockedStudent){
    state.currentStudentId = state.students[0].id;
  }
  if(!state.viewTracked){
    state.viewTracked = true;
    if(state.lockedProfile) trackView('about');
    else if(state.lockedParent && state.currentStudentId) trackView(state.currentStudentId+'_parent');
    else if(state.lockedStudent && state.currentStudentId) trackView(state.currentStudentId+'_student');
  }
  state.loaded = true;
  render();
  attachLiveListeners();
}

function currentStudent(){ return state.students.find(s=>s.id===state.currentStudentId) || null; }
function studentLessons(sid){ return state.lessons.filter(l=>l.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date)); }
function lessonNumberMap(sid){
  const list = studentLessons(sid); const map={};
  list.forEach((l,i)=> map[l.id]=i+1);
  return map;
}
function monthLessonsFor(sid){
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  return studentLessons(sid).filter(l=>{
    const [ly,lm] = l.date.split('-').map(Number);
    return ly===y && lm===m+1;
  });
}

function schedulesForStudent(sid){
  return state.schedules.filter(x=>x.studentId===sid).sort((a,b)=> a.date.localeCompare(b.date) || a.hour-b.hour || a.minute-b.minute);
}
function monthSchedulesFor(sid){
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  const prefix = `${y}-${pad(m+1)}-`;
  return schedulesForStudent(sid).filter(s=> s.date.startsWith(prefix));
}
function occurrencesForDate(sid, dateKey){
  return state.schedules.filter(s=>s.studentId===sid && s.date===dateKey)
    .map(s=>({ ...s, time: formatTime(s.hour, s.minute) }))
    .sort((a,b)=> a.time.localeCompare(b.time));
}
function scheduledDatesInMonth(sid, year, month){
  const prefix = `${year}-${pad(month+1)}-`;
  const set = new Set();
  state.schedules.forEach(s=>{ if(s.studentId===sid && s.date.startsWith(prefix)) set.add(s.date); });
  return set;
}

/* ---------- payment status ---------- */
function monthKeyOf(year, month){ return `${year}-${pad(month+1)}`; }
function rateForMonth(student, year, month){
  const history = student.rateHistory || [];
  if(!history.length) return null;
  const target = monthKeyOf(year, month);
  const sorted = [...history].sort((a,b)=> a.month.localeCompare(b.month));
  let applicable = sorted[0].rate;
  for(const r of sorted){
    if(r.month <= target) applicable = r.rate;
    else break;
  }
  return applicable;
}
function isPaidForMonth(sid, year, month){
  const mk = monthKeyOf(year, month);
  const rec = state.payments.find(p=> p.studentId===sid && p.month===mk);
  return !!(rec && rec.paid);
}
async function togglePayment(sid, year, month){
  const mk = monthKeyOf(year, month);
  const rec = state.payments.find(p=> p.studentId===sid && p.month===mk);
  if(rec){ rec.paid = !rec.paid; }
  else { state.payments.push({ id: uid(), studentId: sid, month: mk, paid: true }); }
  render();
  await savePayments();
}

/* ---------- monthly learning summary ---------- */
function getSummaryText(sid, year, month){
  const mk = monthKeyOf(year, month);
  const rec = state.summaries.find(x=> x.studentId===sid && x.month===mk);
  return rec ? rec.text : '';
}
async function saveSummaryText(sid, year, month, text){
  const mk = monthKeyOf(year, month);
  const rec = state.summaries.find(x=> x.studentId===sid && x.month===mk);
  if(rec){ rec.text = text; }
  else { state.summaries.push({ id: uid(), studentId: sid, month: mk, text }); }
  await saveSummaries();
}

/* ---------- overview: all students combined ---------- */
function allStudentsMonthSummary(year, month){
  const prefix = `${year}-${pad(month+1)}-`;
  return state.students.filter(s=>!s.excludeFromOverview).map(s=>{
    const sched = state.schedules.filter(x=>x.studentId===s.id && x.date.startsWith(prefix));
    const hours = sched.reduce((sum,sc)=> sum + (sc.hours||0), 0);
    const fee = rateForMonth(s, year, month) ? Math.round(hours * rateForMonth(s, year, month)) : null;
    return { id: s.id, name: s.name, hours, fee, count: sched.length };
  });
}
function combinedOccurrencesForDate(dateKey){
  const list = [];
  state.students.filter(s=>!s.excludeFromOverview).forEach(s=>{
    occurrencesForDate(s.id, dateKey).forEach(o=> list.push({ studentName: s.name, time: o.time }));
  });
  return list.sort((a,b)=> a.time.localeCompare(b.time));
}
function combinedScheduledDatesInMonth(year, month){
  const prefix = `${year}-${pad(month+1)}-`;
  const map = new Map();
  state.schedules.forEach(s=>{ if(s.date.startsWith(prefix)) map.set(s.date, (map.get(s.date)||0)+1); });
  return map;
}

function nextOccurrenceFor(sid){
  const todayStr = todayKey();
  const now = new Date();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  return state.schedules
    .filter(s=> s.studentId===sid)
    .filter(s=> s.date > todayStr || (s.date === todayStr && (s.hour*60+s.minute) >= nowMinutes))
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.hour*60+a.minute)-(b.hour*60+b.minute))[0] || null;

function openAvatarCropper(file){
  const objectUrl = URL.createObjectURL(file);
  const FRAME = 240;
  showModal(`
    <h3>調整大頭照</h3>
    <div id="cropStage" style="position:relative;width:${FRAME}px;height:${FRAME}px;margin:0 auto 14px;overflow:hidden;border-radius:50%;background:#000;touch-action:none;cursor:grab;">
      <img id="cropImg" src="${objectUrl}" draggable="false" style="position:absolute;top:0;left:0;user-select:none;">
    </div>
    <div class="field"><label>縮放</label><input type="range" id="cropZoom" min="100" max="300" value="100" style="width:100%;"></div>
    <p style="font-size:12px;color:var(--ink-soft);text-align:center;margin:-6px 0 10px;">拖曳照片調整位置，圓框內就是最後顯示的範圍</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">取消</button>
      <button class="btn btn-primary" id="m-save">確認並上傳</button>
    </div>
  `);

  const stage = $('#cropStage');
  const img = $('#cropImg');
  const zoomInput = $('#cropZoom');
  let naturalW=0, naturalH=0, baseScale=1, scale=1, left=0, top=0;
  let dragging=false, startX=0, startY=0, startLeft=0, startTop=0;

  function applyTransform(){
    img.style.width = (naturalW*scale)+'px';
    img.style.height = (naturalH*scale)+'px';
    img.style.left = left+'px';
    img.style.top = top+'px';
  }
  function clamp(){
    const w = naturalW*scale, h = naturalH*scale;
    if(left>0) left=0;
    if(top>0) top=0;
    if(left < FRAME-w) left = FRAME-w;
    if(top < FRAME-h) top = FRAME-h;
  }
  function initCrop(){
    naturalW = img.naturalWidth;
    naturalH = img.naturalHeight;
    baseScale = Math.max(FRAME/naturalW, FRAME/naturalH);
    scale = baseScale;
    left = (FRAME - naturalW*scale)/2;
    top = (FRAME - naturalH*scale)/2;
    applyTransform();
  }
  img.onload = initCrop;
  if(img.complete && img.naturalWidth) initCrop();

  zoomInput.addEventListener('input', ()=>{
    const factor = Number(zoomInput.value)/100;
    const cx = FRAME/2, cy = FRAME/2;
    const oldW = naturalW*scale, oldH = naturalH*scale;
    const relX = oldW ? (cx-left)/oldW : 0.5;
    const relY = oldH ? (cy-top)/oldH : 0.5;
    scale = baseScale*factor;
    const newW = naturalW*scale, newH = naturalH*scale;
    left = cx - relX*newW;
    top = cy - relY*newH;
    clamp();
    applyTransform();
  });

  function pointerDown(e){
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY; startLeft = left; startTop = top;
  }
  function pointerMove(e){
    if(!dragging) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    left = startLeft + (p.clientX-startX);
    top = startTop + (p.clientY-startY);
    clamp();
    applyTransform();
  }
  function pointerUp(){ dragging = false; }

  stage.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  stage.addEventListener('touchstart', pointerDown, {passive:true});
  stage.addEventListener('touchmove', pointerMove, {passive:false});
  stage.addEventListener('touchend', pointerUp);

  function cleanup(){
    URL.revokeObjectURL(objectUrl);
    window.removeEventListener('mousemove', pointerMove);
    window.removeEventListener('mouseup', pointerUp);
  }

  $('#m-cancel').addEventListener('click', ()=>{ cleanup(); closeModal(); });
  $('#m-save').addEventListener('click', ()=>{
    const OUT = 480;
    const canvas = document.createElement('canvas');
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext('2d');
    const srcX = (0-left)/scale;
    const srcY = (0-top)/scale;
    const srcSize = FRAME/scale;
    ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, OUT, OUT);
    canvas.toBlob(async (blob)=>{
      if(!blob){ showToast('照片處理失敗'); return; }
      const croppedFile = new File([blob], 'avatar.jpg', { type: 'image/jpeg' });
      cleanup();
      closeModal();
      try{
        const url = await uploadImage(croppedFile, 'profile');
        state.profile.photoUrl = url;
        await saveProfile();
        render();
        showToast('照片已更新');
      }catch(err){
        showToast('照片上傳失敗：'+(err?.message||err));
      }
    }, 'image/jpeg', 0.9);
  });
}

function renderCalendar(sid){
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const lessonDates = new Set(studentLessons(sid).map(l=>l.date));
  const scheduledDates = scheduledDatesInMonth(sid, y, m);

  let html = '';
  for(let i=0;i<firstDow;i++) html += `<div class="day pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(y,m,d);
    const key = toKey(dateObj);
    const hasContent = lessonDates.has(key);
    const hasSchedule = scheduledDates.has(key);
    const isToday = key === todayKey();
    const classes = ['day'];
    if(isToday) classes.push('today');
    if(hasContent) classes.push('has-lesson');
    else if(hasSchedule) classes.push('has-schedule');
    if(state.viewMode==='teacher' || hasContent) classes.push('clickable');
    if(state.selectedDate===key) classes.push('selected');
    const dot = hasContent ? '<span class="dot"></span>' : (hasSchedule ? '<span class="dot dot-schedule"></span>' : '');
    html += `<div class="${classes.join(' ')}" data-date="${key}"><span>${d}</span>${dot}</div>`;
  }
  $('#calGrid').innerHTML = html;

  $('#calGrid').querySelectorAll('.day').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.date;
      if(!key) return;
      const existing = state.lessons.find(l=>l.studentId===sid && l.date===key);
      const occ = occurrencesForDate(sid, key);
      if(state.viewMode==='teacher'){
        state.selectedDate = key;
        if(occ.length){ openDayModal(sid, key); }
        else { openForm(existing ? existing.id : null, key); }
      } else if(existing){
        state.selectedDate = key;
        render();
        const target = document.querySelector(`[data-entry="${existing.id}"]`);
        if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });
  });
}

function fieldRow(label, value){

  return `<div class="entry-field"><span class="label">${label}</span>${escapeHtml(value).replace(/\n/g,'<br>')}</div>`;
}

function renderList(sid){
  const items = monthLessonsFor(sid);
  const numMap = lessonNumberMap(sid);
  const list = $('#entryList');
  if(items.length===0){
    list.innerHTML = `<div class="empty-state">這個月還沒有上課紀錄。</div>`;
    return;
  }
  list.innerHTML = items.map(l=>{
    const [y,m,d] = l.date.split('-');
    return `<div class="entry" data-entry="${l.id}">
      <div class="badge">第${numMap[l.id]}堂</div>
      <div class="entry-body">
        <div class="entry-top">
          <span class="entry-date">${y}/${Number(m)}/${Number(d)}</span>
          <span class="entry-dur">${l.hours ? l.hours+' 小時' : ''}</span>
        </div>
        ${fieldRow('上課內容', l.topics)}
        ${fieldRow('回家作業', l.homework)}
        ${state.viewMode==='teacher' ? `
          <div class="entry-actions">
            <button data-edit="${l.id}">編輯</button>
            <button data-del="${l.id}" class="danger">刪除</button>
          </div>` : ''}
      </div>
    </div>`;
  }).join('');

  if(state.viewMode==='teacher'){
    list.querySelectorAll('[data-edit]').forEach(btn=> btn.addEventListener('click', ()=> openForm(btn.dataset.edit)));
    list.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', ()=> deleteLesson(btn.dataset.del)));
  }
}

function openForm(id, prefillDate){
  const s = currentStudent();
  if(!s) return;
  state.editingLessonId = id || null;
  const lesson = id ? state.lessons.find(l=>l.id===id) : null;
  const date = lesson ? lesson.date : (prefillDate || toKey(new Date()));
  const occ = occurrencesForDate(s.id, date);

  const wrap = $('#formWrap');
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div class="field"><label>上課日期</label><input type="date" id="f-date" value="${date}"></div>
    ${occ.length ? `<p style="font-size:12px;color:var(--teal);margin:-4px 0 12px;">排定時間：${occ.map(o=>o.time).join('、')}</p>` : ''}
    <div class="form-row">
      <div class="field"><label>上課時數（小時）</label><input type="number" id="f-hours" step="0.5" min="0.5" placeholder="例如 1.5" value="${lesson?.hours ?? ''}"></div>
    </div>
    <div class="field"><label>上課內容</label><textarea id="f-topics" placeholder="今天教了哪些單元、觀念">${lesson?.topics || ''}</textarea></div>
    <div class="field"><label>回家作業</label><textarea id="f-homework" placeholder="指派給學生的練習">${lesson?.homework || ''}</textarea></div>
    <div class="form-actions">
      <button class="btn btn-primary" id="f-save">儲存</button>
      <button class="btn btn-ghost" id="f-cancel">取消</button>
    </div>
  `;
  $('#f-save').addEventListener('click', saveForm);
  $('#f-cancel').addEventListener('click', closeForm);
  wrap.scrollIntoView({behavior:'smooth', block:'center'});
}

function closeForm(){
  state.editingLessonId = null;
  const wrap = $('#formWrap');
  if(wrap){ wrap.style.display='none'; wrap.innerHTML=''; }
}

async function saveForm(){
  const s = currentStudent();
  const date = $('#f-date').value;
  if(!date){ showToast('請選擇上課日期'); return; }
  const data = {
    id: state.editingLessonId || uid(),
    studentId: s.id,
    date,
    hours: $('#f-hours').value ? Number($('#f-hours').value) : null,
    topics: $('#f-topics').value.trim(),
    homework: $('#f-homework').value.trim(),
  };
  const idx = state.lessons.findIndex(l=>l.id===data.id);
  if(idx>-1) state.lessons[idx] = data; else state.lessons.push(data);
  await saveLessons();
  closeForm();
  render();
}

function deleteLesson(id){
  showModal(`
    <h3>刪除紀錄</h3>
    <p>確定要刪除這筆上課紀錄嗎？</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">取消</button>
      <button class="btn btn-primary" id="m-confirm" style="background:var(--red)">刪除</button>
    </div>
  `);
  $('#m-cancel').addEventListener('click', closeModal);
  $('#m-confirm').addEventListener('click', async ()=>{
    state.lessons = state.lessons.filter(l=>l.id!==id);
    closeModal();
    await saveLessons();
    render();
  });
}

function aboutLinkBanner(){
  const base = getBaseUrl();
  const href = base ? `${base}#/about` : '#/about';
  return `<div class="card" style="text-align:center;">
    <a href="${href}" target="_blank" rel="noopener" style="color:var(--teal);font-size:13px;font-weight:600;text-decoration:underline;">👩‍🏫 認識柏萱老師</a>
  </div>`;
}

function getBaseUrl(){
  try{
    if(location.origin && location.origin !== 'null' && location.protocol !== 'about:'){
      return location.origin + location.pathname;
    }
  }catch(e){}
  return null;
}

async function copyRoleLink(id, role, btnId){
  const base = getBaseUrl();
  const label = role==='parent' ? '家長專屬連結' : '學生專屬連結';
  if(!base){
    showModal(`
      <h3>目前無法產生連結</h3>
      <p>這個畫面現在是 Claude 對話裡的預覽模式，沒有真正的網址，沒辦法做出打得開的連結。請先把這個頁面發布到一個真正的網址（用 Claude 的分享功能，或放到 GitHub Pages 之類的地方），再從那個網址打開這個工具，這個按鈕才會正常運作。</p>
      <div class="modal-actions"><button class="btn btn-primary" id="m-close">了解</button></div>
    `);
    $('#m-close').addEventListener('click', closeModal);
    return;
  }
  const url = `${base}#/${role}/${encodeURIComponent(id)}`;
  try{
    await navigator.clipboard.writeText(url);
    flashLinkCopied(btnId);
    showToast(label+'已複製');
  }catch(e){
    showModal(`
      <h3>${label}</h3>
      <p>請手動選取並複製以下網址：</p>
      <div class="link-box"><input type="text" id="m-link" value="${url}" readonly></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="m-close">關閉</button>
      </div>
    `);
    const input = $('#m-link');
    input.focus();
    input.select();
    $('#m-close').addEventListener('click', closeModal);
  }
}
function copyParentLink(id){ return copyRoleLink(id, 'parent', 'linkBtn'); }
function copyStudentLink(id){ return copyRoleLink(id, 'student', 'studentLinkBtn'); }

function flashLinkCopied(btnId){
  const btn = $('#'+(btnId||'linkBtn'));
  if(!btn) return;
  const original = btn.textContent;
  btn.textContent = '已複製連結！';
  setTimeout(()=>{ if(btn) btn.textContent = original; }, 1600);
}

function renderModeUI(){
  const toggle = $('#modeToggle');
  const locked = state.lockedParent || state.lockedStudent || state.lockedProfile;
  toggle.style.display = locked ? 'none' : 'flex';
  $('#btnTeacher').classList.toggle('active', state.viewMode==='teacher');
  $('#btnParent').classList.toggle('active', state.viewMode==='parent');
  $('#btnStudent').classList.toggle('active', state.viewMode==='student');
  $('#backupRow').style.display = (!locked && state.viewMode==='teacher') ? 'flex' : 'none';
  const showOv = !locked && state.viewMode==='teacher';
  $('#overviewRow').style.display = showOv ? 'flex' : 'none';
  if(showOv){
    $('#overviewBtn').textContent = state.showOverview ? '← 返回學生檢視' : '📊 全部學生總覽';
    $('#profileEditBtn').textContent = state.showProfileEdit ? '← 返回學生檢視' : '👩\u200d🏫 編輯老師介紹頁';
  }
  const ABOUT_TITLE = '柏萱老師👩🏻\u200d🏫 ｜高中數學教師';
  const DEFAULT_TITLE = '數學家教紀錄📝';
  $('#mainTitle').textContent = state.lockedProfile ? ABOUT_TITLE : DEFAULT_TITLE;
  document.title = state.lockedProfile ? ABOUT_TITLE : DEFAULT_TITLE;
  const ABOUT_TAGLINE = '10年以上高中數學教學經驗｜合格教師證｜雙碩士｜線上高中數學教師🧮';
  const DEFAULT_TAGLINE = '希望孩子的數學能夠越來越穩定進步💪🏻讓我們一起努力吧🌷';
  $('#encourageText').textContent = state.lockedProfile ? ABOUT_TAGLINE : DEFAULT_TAGLINE;
  const s = currentStudent();
  $('#subline').textContent = state.lockedProfile
    ? '老師介紹頁'
    : state.lockedParent
      ? (s ? `${s.name}的上課紀錄` : '找不到這位學生')
      : state.lockedStudent
        ? (s ? `${s.name} 同學專屬頁面` : '找不到這位學生')
        : (state.viewMode==='teacher'
          ? `共 ${state.students.length} 位學生・點選日曆日期即可新增或編輯`
          : state.viewMode==='parent'
            ? (s ? `目前檢視：${s.name}` : '請選擇學生')
            : (s ? `學生檢視預覽：${s.name}` : '請選擇學生'));
}

function exportBackup(){
  const payload = {
    students: state.students,
    lessons: state.lessons,
    schedules: state.schedules,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tutor-log-backup-${toKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('備份檔案已下載');
}

function handleImportFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ showToast('⚠️ 檔案格式錯誤，無法匯入'); return; }
    confirmImport(data);
  };
  reader.readAsText(file);
}

function confirmImport(data){
  showModal(`
    <h3>匯入備份</h3>
    <p>這會覆蓋目前畫面上所有學生、課表與上課紀錄，確定要匯入嗎？</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">取消</button>
      <button class="btn btn-primary" id="m-confirm">匯入</button>
    </div>
  `);
  $('#m-cancel').addEventListener('click', closeModal);
  $('#m-confirm').addEventListener('click', async ()=>{
    state.students = Array.isArray(data.students) ? data.students : [];
    state.lessons = Array.isArray(data.lessons) ? data.lessons : [];
    state.schedules = Array.isArray(data.schedules) ? data.schedules : [];
    state.currentStudentId = state.students[0]?.id || null;
    closeModal();
    await Promise.all([saveStudents(), saveLessons(), saveSchedules()]);
    render();
    showToast('匯入完成');
  });
}

function render(){
  if(!state.loaded) return;
  renderModeUI();
  if(state.lockedProfile){
    $('#studentTabs').style.display = 'none';
    renderProfilePage();
    return;
  }
  if(state.lockedStudent){
    $('#studentTabs').style.display = 'none';
    renderStudentView();
    return;
  }
  const inOverview = !state.lockedParent && state.viewMode==='teacher' && state.showOverview;
  const inProfileEdit = !state.lockedParent && state.viewMode==='teacher' && state.showProfileEdit;
  $('#studentTabs').style.display = (inOverview || inProfileEdit) ? 'none' : '';
  if(inOverview){
    renderOverview();
  } else if(inProfileEdit){
    renderProfileEditor();
  } else if(!state.lockedParent && state.viewMode==='student'){
    renderTabs();
    renderStudentView();
  } else {
    renderTabs();
    renderMain();
  }
}

$('#btnTeacher').addEventListener('click', ()=>{ state.viewMode='teacher'; render(); });
$('#btnParent').addEventListener('click', ()=>{ state.viewMode='parent'; state.showOverview=false; state.showProfileEdit=false; render(); });
$('#btnStudent').addEventListener('click', ()=>{ state.viewMode='student'; state.showOverview=false; state.showProfileEdit=false; render(); });
$('#overviewBtn').addEventListener('click', ()=>{ state.showOverview = !state.showOverview; if(state.showOverview) state.showProfileEdit=false; render(); });
$('#profileEditBtn').addEventListener('click', ()=>{ state.showProfileEdit = !state.showProfileEdit; if(state.showProfileEdit) state.showOverview=false; render(); });
$('#exportBtn').addEventListener('click', exportBackup);
$('#importBtn').addEventListener('click', ()=> $('#importFile').click());
$('#importFile').addEventListener('change', handleImportFile);

loadData();
</script>
</body>
</html>
